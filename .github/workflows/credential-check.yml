# Manual check: calling review.yml with no secrets must fail with a clear message.
# Kept out of ci.yml because a failing called workflow would turn every CI run red.
name: credential-check
on: workflow_dispatch
permissions:
  contents: read
  pull-requests: read
jobs:
  no-secrets:
    uses: ./.github/workflows/review.yml
    with:
      repository: aowen14/dev-agent-workshop-starter
      pr_number: FIXTURE_PR_PLACEHOLDER
      dry_run: true
