# Copy to .github/workflows/review.yml. Needs a CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret.
name: Claude review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:   # fork-PR notice only; never checks out or reviews PR code
    types: [opened]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    uses: aowen14/review-kit/.github/workflows/review.yml@v1
    # Pass secrets by name. `secrets: inherit` only works when this repo and review-kit belong
    # to the same account, organization, or enterprise; otherwise it passes nothing.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
