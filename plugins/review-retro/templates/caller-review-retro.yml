# Copy to .github/workflows/review-retro.yml. Needs a CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY
# secret, and "Allow GitHub Actions to create and approve pull requests" enabled in the repo (or org)
# Actions settings so the job can open the proposal PR.
name: Review retro
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC; schedules must live in the calling repo
  workflow_dispatch:
    inputs:
      prs:
        description: "Merged PRs to scan"
        default: "20"
      dry_run:
        description: "Print the proposal instead of opening a PR"
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
jobs:
  retro:
    uses: aowen14/review-kit/.github/workflows/review-retro.yml@v1
    with:
      prs: ${{ fromJSON(inputs.prs || '20') }}
      dry_run: ${{ inputs.dry_run || false }}
      # skip_paths: "docs/**,*.lock"
      # rules_file: .github/REVIEW.candidate.md   # only when the repo has no REVIEW.md yet
    secrets: inherit
